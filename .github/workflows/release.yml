# Builds RemoteFlow for Windows and Linux when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3)
# and creates a DRAFT release on GitHub with the installers, the portable programs (Windows .exe, Linux
# binary), their updater signatures and latest.json.
# Publishing the draft (Releases → Edit → Publish) makes it available to the in-app updater.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           – content of the private key file (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  – its password
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the version and the updater key is set
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
          if grep -q REPLACE_WITH_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.conf.json (see README – Releases)"; exit 1
          fi
          node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Create draft release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: `RemoteFlow ${process.env.GITHUB_REF_NAME}`,
              body: fs.readFileSync('release-notes.md', 'utf8'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # Ubuntu 22.04: older glibc, so the Linux packages run on more distributions
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file patchelf libarchive-tools zstd libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Release notes (CHANGELOG section – also shown by the in-app updater)
        id: notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo 'body<<RF_NOTES_EOF'
            node scripts/release-notes.mjs "$VERSION"
            echo 'RF_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (AppImage) cannot use FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true

      # Portable program (no installer): the same executable the installers contain, signed for the
      # in-app updater of portable copies (latest.json entry {os}-x86_64-portable, see below)
      - name: Portable program – copy and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p portable
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/remoteflow.exe "portable/remoteflow_${VERSION}_x64-portable.exe"
          else
            cp src-tauri/target/release/remoteflow "portable/remoteflow_${VERSION}_amd64-portable"
          fi
          for f in portable/*; do npx tauri signer sign "$f"; done
          ls -l portable

      - name: Portable program – upload
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            for (const name of fs.readdirSync('portable')) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number('${{ needs.create-release.outputs.release_id }}'),
                name,
                data: fs.readFileSync(`portable/${name}`),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }

      # Arch Linux package (pacman) with the same program. Deliberately a separate step without the
      # signing key: pacman packages are installed by pacman, not by the in-app updater.
      - name: Arch Linux package – build
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          bash scripts/build-arch-pkg.sh src-tauri/target/release/remoteflow archpkg
          ls -l archpkg

      - name: Arch Linux package – upload
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            for (const name of fs.readdirSync('archpkg')) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number('${{ needs.create-release.outputs.release_id }}'),
                name,
                data: fs.readFileSync(`archpkg/${name}`),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }

  # Adds the portable programs to latest.json (after both builds have uploaded their part of it)
  portable-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Add portable entries to latest.json
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');
            const tag = process.env.GITHUB_REF_NAME;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            const download = async (asset) => {
              const res = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
              });
              return Buffer.from(res.data).toString('utf8');
            };
            const manifestAsset = assets.find((a) => a.name === 'latest.json');
            if (!manifestAsset) throw new Error('latest.json is missing in the release');
            const manifest = JSON.parse(await download(manifestAsset));
            const platforms = { '_x64-portable.exe': 'windows-x86_64-portable', '_amd64-portable': 'linux-x86_64-portable' };
            for (const asset of assets) {
              const suffix = Object.keys(platforms).find((s) => asset.name.endsWith(s));
              if (!suffix) continue;
              const sig = assets.find((a) => a.name === `${asset.name}.sig`);
              if (!sig) throw new Error(`Missing signature for ${asset.name}`);
              manifest.platforms[platforms[suffix]] = {
                signature: (await download(sig)).trim(),
                url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(asset.name)}`,
              };
              core.info(`${platforms[suffix]}: ${asset.name}`);
            }
            await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: manifestAsset.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json',
              data: Buffer.from(JSON.stringify(manifest, null, 2)),
              headers: { 'content-type': 'application/json' },
            });

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: node scripts/check-i18n.mjs && npm run build
      - run: cargo test --lib --locked
        working-directory: src-tauri
